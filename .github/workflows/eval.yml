# PR마다 테스트와 검색 회귀 평가를 돌린다. LLM 호출과 API 키는 없다
name: eval

on:
  pull_request:
    branches: [main]

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv sync

      # bge-m3(약 2GB)를 PR마다 내려받지 않도록 캐시한다
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-m3

      - run: uv run pytest

      # data/chroma는 git에 없어서 노트로 색인을 새로 만든다
      - run: uv run python -c "from retriever import build_index; build_index()"
        env:
          PYTHONPATH: src

      - run: uv run python src/evaluate.py
