[project]
name = "chagok"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "chromadb>=1.5.9",
    "markdown-it-py>=4.2.0",
    "python-frontmatter>=1.3.0",
    "sentence-transformers>=6.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
